name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: Build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: KH-PAX-Viewer
          path: build/Release/KH PAX Viewer.exe
